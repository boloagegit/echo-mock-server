# SQLite profile（相容用）
# SQLite 已是預設資料庫；明確啟用此 profile 時沿用舊版的資料檔位置 ./mockdb.sqlite，
# 讓既有以 --spring.profiles.active=sqlite 啟動的環境升級後仍使用同一個檔案。
# 其餘設定（WAL、連線池、Dialect、啟動復原）都在 application.yml。
spring:
  datasource:
    url: jdbc:sqlite:./mockdb.sqlite?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=ON
