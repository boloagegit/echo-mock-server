# SQLite Database (穩定不怕 crash)
# 啟用方式: --spring.profiles.active=sqlite
spring:
  datasource:
    url: jdbc:sqlite:./mockdb.sqlite?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=ON
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 3        # SQLite 單寫者，3 連線足夠 (1 writer + 2 reader)
      minimum-idle: 1
      connection-timeout: 15000   # 必須 > busy_timeout，避免 pool 比 SQLite 先放棄
      idle-timeout: 600000        # 10 分鐘（SQLite in-process，不需頻繁回收）
      max-lifetime: 0             # 不限制（SQLite 無 server 端 timeout）

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
