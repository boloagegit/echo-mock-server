# SQLite profile (for compatibility)
# SQLite is already the default database; when explicitly enabling this profile, the old version's data file location ./mockdb.sqlite will be used.
# Let the existing environment started with --spring.profiles.active=sqlite still use the same file after upgrading.
# The rest of the settings (WAL, connection pool, Dialect, startup recovery) are all in application.yml.
spring:
  datasource:
    url: jdbc:sqlite:./mockdb.sqlite?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=ON
