server:
  port: 8080
  undertow:
    max-http-post-size: 10485760  # 10MB，允許帶 base64 圖片的大 request 進入
    threads:
      worker: 32        # Undertow worker threads，可用環境變數 SERVER_UNDERTOW_THREADS_WORKER 覆蓋
  servlet:
    session:
      timeout: 180d  # Session 180 天 (約半年) 過期
      cookie:
        max-age: 180d  # Cookie 也設定 180 天

spring:
  web:
    resources:
      cache:
        period: 0  # 開發環境不快取靜態資源
  application:
    name: echo

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration

  # Database: 預設 H2 Embedded，啟用 sqlite profile 可覆蓋
  # 切換方式: --spring.profiles.active=sqlite 或 SPRING_PROFILES_ACTIVE=sqlite
  datasource:
    url: jdbc:h2:file:./mockdb;AUTO_RECONNECT=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=100;TRACE_LEVEL_FILE=0
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  # Caffeine Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=43200s

  # Artemis - 由 echo.jms 設定控制，此區塊保留供 Spring Boot 自動配置
  artemis:
    mode: embedded

# Echo 自訂配置
echo:
  env-label:                    # 環境別名（如 DEV、SIT、UAT），可用環境變數 ECHO_ENV_LABEL 覆蓋
  features:
    bulk-import-export-enabled: ${ECHO_BULK_IMPORT_EXPORT_ENABLED:false}  # 批次匯入／匯出，預設關閉
    scenarios-enabled: ${ECHO_SCENARIOS_ENABLED:false}                    # Scenario 狀態機，預設關閉
    rule-drag-sort-enabled: ${ECHO_RULE_DRAG_SORT_ENABLED:false}          # 規則列表拖曳排序，預設關閉
  remember-me:
    key: ${ECHO_REMEMBER_ME_KEY:change-me-in-production}  # 必須透過環境變數覆蓋
    validity: 180d                # Remember Me cookie 有效期，可用環境變數 ECHO_REMEMBER_ME_VALIDITY 覆蓋
  admin:
    username: admin             # 可用環境變數 ECHO_ADMIN_USERNAME 覆蓋
    password: "{bcrypt}$2a$10$cGp.LHC3zCORJIgwLvh6qehSMWZV27KbwI0VravTWP51EkxvbkEmm"  # admin，可用環境變數 ECHO_ADMIN_PASSWORD 覆蓋
  storage:
    mode: database  # database 或 file
    file-path: ./data/rules.json  # file 模式時的路徑
  cache:
    body:
      max-size-mb: 50          # Response body 快取上限 (MB)，512MB heap 下不宜過大
      threshold-kb: 5120      # 超過此大小的 body 不快取 (KB) - 5MB
      expire-minutes: 720     # 快取過期時間 (分鐘) - 12 小時
    sync-interval-ms: 5000    # 多實例 cache 同步間隔 (毫秒)
  jms:
    enabled: false
    alias:                     # JMS 協定顯示別名，可用環境變數 ECHO_JMS_ALIAS 覆蓋
    port: 61616              # Artemis 監聽埠 (外部服務連線 tcp://localhost:61616)
    username: admin          # Artemis 帳密，可用環境變數 ECHO_JMS_USERNAME / ECHO_JMS_PASSWORD 覆蓋
    password: admin
    concurrency: "10-30"     # JMS listener 並發數 (min-max)，可用環境變數 ECHO_JMS_CONCURRENCY 覆蓋
    queue: ECHO.REQUEST      # Echo 監聽的 Source Queue（外部服務送訊息到此 Queue）
    endpoint-field: ServiceName  # 從訊息 body 提取端點識別欄位（XML element / JSON key）
    target:
      enabled: false         # true 時啟用轉發到目標 JMS Server
      type: tibco            # artemis | tibco
      server-url: tcp://esb-server:7222
      username: admin
      password: changeme       # 範例佔位符，請透過環境變數 ECHO_JMS_TARGET_PASSWORD 覆蓋
      timeout-seconds: 30
      queue: TARGET.REQUEST  # 目標 JMS Server 上的 Queue（轉發目的地）
  http:
    alias: HTTP     # HTTP 協定顯示名稱
    # HTTP request 的總時間預算；連線設定的 pool + connect + read 必須小於此值
    request-timeout-ms: ${ECHO_HTTP_REQUEST_TIMEOUT_MS:40000}
    forward:
      # 全部 HTTP 下游共用並行連線上限；不再另設單一下游 50 條限制
      max-connections: ${ECHO_HTTP_FORWARD_MAX_CONNECTIONS:1000}
      # 容量用盡時最多等待筆數；超過立即回應容量不足，避免尖峰耗盡 heap
      max-pending-requests: ${ECHO_HTTP_FORWARD_MAX_PENDING_REQUESTS:1000}
      # 單筆下游回應最多 10 MiB；Content-Length 與 chunked body 都會檢查
      max-response-body-bytes: ${ECHO_HTTP_FORWARD_MAX_RESPONSE_BODY_BYTES:10485760}
      # 全部進行中下游回應合計最多緩衝 128 MiB，避免 1000 條連線同時撐爆 heap
      max-buffered-response-bytes: ${ECHO_HTTP_FORWARD_MAX_BUFFERED_RESPONSE_BYTES:134217728}
      pool-acquire-timeout-ms: ${ECHO_HTTP_FORWARD_POOL_ACQUIRE_TIMEOUT_MS:3000}
  stats:
    retention-days: 7  # 統計資料保留天數
  request-log:
    store: database    # memory 或 database
    max-records: 10000 # 最大記錄數
    durable:
      # 獨立 SQLite WAL 先接收紀錄，主資料庫暫時不可用時不會靜默丟失
      spool-path: ${ECHO_REQUEST_LOG_SPOOL_PATH:./data/request-log-spool.sqlite}
      append-queue-capacity: ${ECHO_REQUEST_LOG_SPOOL_QUEUE_CAPACITY:2000}
      append-batch-size: ${ECHO_REQUEST_LOG_SPOOL_BATCH_SIZE:100}
      group-commit-ms: ${ECHO_REQUEST_LOG_SPOOL_GROUP_COMMIT_MS:2}
      queue-offer-timeout-ms: ${ECHO_REQUEST_LOG_SPOOL_OFFER_TIMEOUT_MS:10000}
      retry-ms: ${ECHO_REQUEST_LOG_SPOOL_RETRY_MS:250}
      max-pending-bytes: ${ECHO_REQUEST_LOG_SPOOL_MAX_PENDING_BYTES:10737418240}
  audit:
    retention-days: 30  # 審計記錄保留天數
  cleanup:
    enabled: true           # 啟用定時清除
    cron: "0 0 3 * * *"     # 每天凌晨 3 點執行
    rule-retention-days: 180  # 規則保留天數 (預設半年)
    response-retention-days: 180  # 回應保留天數
  backup:
    enabled: true             # 啟用 H2 自動備份 (僅 H2 Embedded 模式)
    cron: "0 0 3 * * *"       # 每天凌晨 3 點執行
    path: ./backups           # 備份目錄
    retention-days: 7         # 備份保留天數
    on-shutdown: true         # 應用關閉時備份
  agent:
    log:
      queue-capacity: 3000           # LogAgent 佇列容量
      batch-size: 50                # 批次大小觸發閾值
      flush-interval-seconds: 5     # 時間觸發間隔（秒）
      max-write-rate-per-second: ${ECHO_AGENT_LOG_MAX_WRITE_RATE_PER_SECOND:1000}
    analysis:
      enabled: true                 # 啟用匹配鏈分析（near-miss / shadowed 偵測）
  matcher:
    max-field-value-length: 2097152  # 單一欄位值長度上限 (bytes)，超過跳過比對，預設 2MB
  builtin-account:
    self-registration: false  # 設為 true 允許未登入使用者自行申請帳號
  ldap:
    enabled: false  # 設為 true 啟用 LDAP 認證
    url: ldap://ldap.example.com:389
    base-dn: dc=example,dc=com
    user-pattern: uid={0},ou=users

logging:
  file:
    path: ${LOGGING_FILE_PATH:./logs}  # 預設 ./logs，可用環境變數覆蓋
  level:
    root: WARN
    com.echo: INFO
