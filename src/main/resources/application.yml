server:
  port: 8080
  undertow:
    max-http-post-size: 10485760  # 10MB, allow large request with base64 picture to enter
    threads:
      # I/O threads stay CPU-derived unless SERVER_UNDERTOW_THREADS_IO is set.
      # A single I/O thread helps some workloads but is not universally faster; see docs/http-io-tuning.md.
      worker: 32        # Undertow worker threads, which can be overridden by the environment variable SERVER_UNDERTOW_THREADS_WORKER
  servlet:
    session:
      timeout: 180d  # Session expires in 180 days (about half a year)
      cookie:
        max-age: 180d  # Cookie is also set to 180 days

spring:
  web:
    resources:
      cache:
        # Browsers may cache static resources but revalidate with Last-Modified each time, receiving 304 when unchanged and fresh files after updates.
        # index.html is set to not be cached by WebMvcConfig.
        cachecontrol:
          no-cache: true
        use-last-modified: true
  application:
    name: echo
  # Background scheduling (cache sync, cleanup, backup) uses Spring Boot's own scheduler thread, separate from the native HTTP timer.
  # More than one thread so that nightly backup does not block cache synchronization every 5 seconds.
  task:
    scheduling:
      thread-name-prefix: echo-scheduled-
      pool:
        size: ${ECHO_SCHEDULING_POOL_SIZE:4}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration

  # Database: Default SQLite (WAL), the data file is located at ./data (Docker volume mount point)
  # Select the matching profile for external databases: postgresql, mysql, mariadb, sqlserver, or oracle.
  # H2 is no longer supported; migrate existing H2 data with scripts/migrate-h2-to-sqlite.py.
  datasource:
    url: jdbc:sqlite:./data/mockdb.sqlite?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=ON
    driver-class-name: org.sqlite.JDBC
    hikari:
      # The transaction manager serializes writes; the connection pool retains parallel read capabilities for WAL.
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 15000   # Must exceed busy_timeout so the pool does not give up before SQLite.
      idle-timeout: 600000        # 10 minutes (SQLite in-process, no need for frequent recycling)
      max-lifetime: 0             # Unlimited; SQLite has no server-side timeout.

  jpa:
    database-platform: com.echo.config.EchoSqliteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  # Caffeine Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=43200s

  # Artemis - controlled by echo.jms settings, this block is reserved for automatic configuration by Spring Boot
  artemis:
    mode: embedded
    embedded:
      # Boot will still automatically configure Artemis; just disabling listener for Echo will not prevent the built-in broker from starting.
      enabled: ${echo.jms.enabled:false}

# Echo Custom configuration
echo:
  sse:
    # Close connections whose clients stop reading and block writes beyond this timeout, in milliseconds with a minimum of 1000; exclude waits between events.
    stalled-write-timeout-ms: ${ECHO_SSE_STALLED_WRITE_TIMEOUT_MS:120000}
  # Healthy requests write no diagnostic file lines. Anomalies have bounded metadata only.
  diagnostics:
    enabled: ${ECHO_DIAGNOSTICS_ENABLED:true}
    jms-enabled: true
    http-enabled: true
    sse-enabled: true
    queue-capacity: 1024 # bounded to 32..4096, one daemon writer, no body/header logging
    detailed-enabled: false # temporary troubleshooting only; auto-expires after startup
    detailed-seconds: 300 # maximum 600; all detail still shares the byte/rate limits
    daily-bytes: 10485760 # 10 MiB, UTF-8 bytes including newlines, retained across restarts
    retained-bytes: 52428800 # 50 MiB across owned diagnostic day files
    retention-days: 7 # maximum seven days including today, capacity may shorten history
    records-per-second: 20 # aggregate anomaly/detail output limit, omitted records counted
  sqlite:
    recovery:
      # fail-fast: preserve a corrupt database and abort startup; restore-latest: restore the newest valid backup.
      mode: ${ECHO_SQLITE_RECOVERY_MODE:fail-fast}
      # Exit when confirming runtime corruption, leaving it to supervisor to restart and perform the above startup recovery
      runtime-check-enabled: ${ECHO_SQLITE_RUNTIME_CHECK_ENABLED:true}
      runtime-check-interval-ms: ${ECHO_SQLITE_RUNTIME_CHECK_INTERVAL_MS:30000}
  # Resource snapshots are ADMIN-only and collected only on manual refresh.
  monitoring:
    enabled: true
    jvm-enabled: true
    # JVM notifications are retained even while the admin page is closed. No forced GC or disk writes.
    gc-enabled: true
    gc-history-capacity: 512 # 16..4096 events; oldest events are overwritten, cleared on restart
    gc-history-max-age-seconds: 86400 # Also expire after 24h; idle housekeeping runs every minute
    caches-enabled: true
    scheduler-enabled: true
    jms-enabled: true
    http-enabled: true
    database-enabled: true
    request-log-enabled: true
    application-log-enabled: true
    storage-enabled: true
  env-label:                    # Environment alias (such as DEV, SIT, UAT), which can be overridden by the environment variable ECHO_ENV_LABEL
  ui:
    accent: ${ECHO_UI_ACCENT:teal}  # UI accent color: teal or blue, to distinguish deployments; unknown values fall back to teal.
    easter-egg: ${ECHO_UI_EASTER_EGG:true}  # UI easter egg: enter ↑↑↓↓←→←→AB or click the Echo icon five times to open the mini-game; set false to disable.
  features:
    issue-reporting-enabled: ${ECHO_ISSUE_REPORTING_ENABLED:false}      # Issue reporting, disabled by default.
    bulk-import-export-enabled: ${ECHO_BULK_IMPORT_EXPORT_ENABLED:false}  # Bulk import/export, disabled by default.
    scenarios-enabled: ${ECHO_SCENARIOS_ENABLED:false}                    # Scenario state machine, disabled by default.
  remember-me:
    key: ${ECHO_REMEMBER_ME_KEY:change-me-in-production}  # Must be overridden through environment variables
    validity: 180d                # Remember Me cookie validity period, which can be overridden by the environment variable ECHO_REMEMBER_ME_VALIDITY
  admin:
    username: admin             # Override with the ECHO_ADMIN_USERNAME environment variable.
    password: "{bcrypt}$2a$10$cGp.LHC3zCORJIgwLvh6qehSMWZV27KbwI0VravTWP51EkxvbkEmm"  # admin, which can be overridden by the environment variable ECHO_ADMIN_PASSWORD
  storage:
    mode: database  # database or file
    file-path: ./data/rules.json  # Path in file mode
  cache:
    body:
      max-size-mb: 50          # Response-body cache limit in MB; keep it modest with a 512 MB heap.
      threshold-kb: 5120      # body larger than this size is not cached (KB) - 5MB
      expire-minutes: 720     # Cache idle expiration time (minutes) - 12 hours
      max-age-minutes: 60     # Maximum cache lifetime regardless of access, as a fallback for missed cross-instance notifications.
    template:
      # Bound the template cache using conservative estimates of source and compiled structure; render oversized templates without caching them.
      max-weight-mb: ${ECHO_CACHE_TEMPLATE_MAX_WEIGHT_MB:16}
    rules:
      max-age-minutes: 10     # Maximum cache lifetime for rules and HTTP forwarding connections, as a cross-instance safety net.
      change-wait-ms: 5000    # Maximum time a rule-changing request waits for the new snapshot; mock requests keep using the previous snapshot without waiting during rebuild.
    sync-interval-ms: 5000    # Multi-instance cache synchronization interval (milliseconds)
  jms:
    enabled: false
    policy-summary-enabled: true # Describes policy; does not suppress Artemis warnings.
    alias:                     # JMS protocol display alias, which can be overridden by the environment variable ECHO_JMS_ALIAS
    port: 61616              # Artemis listening port (external service connection tcp://localhost:61616)
    username: admin          # Artemis credentials, overridden by ECHO_JMS_USERNAME / ECHO_JMS_PASSWORD environment variables.
    password: admin
    concurrency: "10-30"     # JMS listener concurrency (min-max), overridden by ECHO_JMS_CONCURRENCY.
    forward:
      session-cache-size: 8       # Maximum idle Session instances retained per target version; 0 disables caching. Each request has its own reply queue.
      # Preserve the provider's connection, retry, and failover policies by default; validate actual ESB failure behavior before enabling this option.
      bounded-waits-enabled: ${ECHO_JMS_FORWARD_BOUNDED_WAITS_ENABLED:false}
    queue: ECHO.REQUEST      # Source queue listened to by Echo; external services send messages here.
    # Opt in to source rollback when a reply fails. Redelivery can repeat processing and downstream effects.
    rollback-on-reply-failure: ${ECHO_JMS_ROLLBACK_ON_REPLY_FAILURE:false}
    source:
      # Where to receive JMS: embedded (built-in Artemis, default) | artemis | tibco (external shared broker, such as ESB)
      # When multiple Echo instances share an external queue, the broker delivers each message to just one instance.
      type: ${ECHO_JMS_SOURCE_TYPE:embedded}
      server-url: ${ECHO_JMS_SOURCE_SERVER_URL:}
      username: ${ECHO_JMS_SOURCE_USERNAME:}
      password: ${ECHO_JMS_SOURCE_PASSWORD:}
      reconnect-interval-ms: 5000   # Retry interval when external broker cannot connect
    endpoint-field: ServiceName  # Extract endpoint identification field from message body (XML element / JSON key)
    target:
      name: ${ECHO_JMS_TARGET_NAME:}  # The downstream name displayed in the interface and request records, such as ESB-UAT; when blank, application.yml is displayed
      enabled: false         # Enable forwarding to the target JMS server when true.
      type: tibco            # artemis | tibco
      server-url: tcp://esb-server:7222
      username: admin
      password: changeme       # Sample placeholder, please overwrite it through the environment variable ECHO_JMS_TARGET_PASSWORD
      timeout-seconds: 30
      queue: TARGET.REQUEST  # Queue on destination JMS Server (forward destination)
    # Idle timeout in milliseconds for consumerless temporary reply queues; 0 deletes them only when the client connection closes.
    # Prevent clients that create but never delete per-request temporary queues from exhausting the heap over several days.
    temporary-queue-idle-delete-ms: ${ECHO_JMS_TEMPORARY_QUEUE_IDLE_DELETE_MS:10000}
    # Retain messages after listener transaction failures and redeliver with backoff; -1 disables automatic discard.
    redelivery-delay-ms: ${ECHO_JMS_REDELIVERY_DELAY_MS:250}
    redelivery-multiplier: ${ECHO_JMS_REDELIVERY_MULTIPLIER:2.0}
    max-redelivery-delay-ms: ${ECHO_JMS_MAX_REDELIVERY_DELAY_MS:5000}
    max-delivery-attempts: ${ECHO_JMS_MAX_DELIVERY_ATTEMPTS:-1}
    # Reserve 512 MiB so the broker blocks producers before the disk actually reaches zero free bytes.
    min-disk-free-bytes: ${ECHO_JMS_MIN_DISK_FREE_BYTES:536870912}
    disk-scan-period-ms: ${ECHO_JMS_DISK_SCAN_PERIOD_MS:1000}
  http:
    alias: HTTP     # HTTP protocol display name
    # native: HTTP/1.1 acceleration path with capacity upper limit; special requests still go through Servlet. See docs/native-http.md for details.
    # Enabled by default; set ECHO_HTTP_TRANSPORT=servlet and restart to switch back to the original entrance.
    transport: ${ECHO_HTTP_TRANSPORT:native}
    native:
      # Keep validated UTF-8 forwarding responses in bounded segments; false restores the text path after restart.
      segmented-forwarding-enabled: ${ECHO_HTTP_NATIVE_SEGMENTED_FORWARDING_ENABLED:true}
      # Eligible response bodies wait after headers, retaining a slot until delivery finishes.
      max-forwarding-bodies: ${ECHO_HTTP_NATIVE_MAX_FORWARDING_BODIES:8}
      # Retire only idle worker threads, leaving busy workers alone; 0 preserves the previous behavior of keeping idle threads.
      worker-idle-timeout-seconds: ${ECHO_HTTP_NATIVE_WORKER_IDLE_TIMEOUT_SECONDS:60}
    # Total HTTP request budget; connection settings for pool wait + connect + read must sum to less than this value.
    request-timeout-ms: ${ECHO_HTTP_REQUEST_TIMEOUT_MS:40000}
    forward:
      # Concurrent-connection limit shared by all HTTP targets; no separate 50-connection per-target limit.
      max-connections: ${ECHO_HTTP_FORWARD_MAX_CONNECTIONS:1000}
      # Maximum waiting requests when capacity is exhausted; reject excess requests immediately to prevent traffic spikes from exhausting the heap.
      max-pending-requests: ${ECHO_HTTP_FORWARD_MAX_PENDING_REQUESTS:1000}
      # Limit each downstream response to 10 MiB; check both Content-Length and chunked bodies.
      max-response-body-bytes: ${ECHO_HTTP_FORWARD_MAX_RESPONSE_BODY_BYTES:10485760}
      # Buffer at most 128 MiB across all in-flight downstream responses, preventing 1000 concurrent connections from exhausting the heap.
      max-buffered-response-bytes: ${ECHO_HTTP_FORWARD_MAX_BUFFERED_RESPONSE_BYTES:134217728}
      pool-acquire-timeout-ms: ${ECHO_HTTP_FORWARD_POOL_ACQUIRE_TIMEOUT_MS:3000}
      # Overall admin connection-test deadline, including pool wait, redirects and a continuously dripping body.
      test-timeout-seconds: ${ECHO_HTTP_FORWARD_TEST_TIMEOUT_SECONDS:30}
  stats:
    retention-days: 7  # Number of days to retain statistical data
  request-log:
    # SQLite: insert new logs using JDBC batches; false selects JPA. Other databases continue using JPA.
    jdbc-batch-enabled: ${ECHO_REQUEST_LOG_JDBC_BATCH_ENABLED:true}
    enabled: ${ECHO_REQUEST_LOG_ENABLED:true} # false disables new request logs entirely, isolating core performance during load tests.
    store: database    # memory or database
    max-records: 10000 # Maximum number of records
    # false (default): reply without waiting for log writes; drop oldest logs if writes fall behind. Mock replies remain unaffected, but an unexpected process exit loses unwritten logs.
    # true: wait for each spool write before replying; return 503 if the log cannot be written, at the cost of latency.
    wait-for-write: ${ECHO_REQUEST_LOG_WAIT_FOR_WRITE:false}
    buffer:
      max-entries: ${ECHO_REQUEST_LOG_BUFFER_MAX_ENTRIES:20000} # Maximum number of records waiting to be written
      max-mb: ${ECHO_REQUEST_LOG_BUFFER_MAX_MB:64}               # The maximum amount of memory occupied by records waiting to be written (MB)
    durable:
      # Independent SQLite WAL receives records first and will not be lost silently when the main database is temporarily unavailable.
      spool-path: ${ECHO_REQUEST_LOG_SPOOL_PATH:./data/request-log-spool.sqlite}
      append-queue-capacity: ${ECHO_REQUEST_LOG_SPOOL_QUEUE_CAPACITY:2000}
      append-batch-size: ${ECHO_REQUEST_LOG_SPOOL_BATCH_SIZE:100}
      group-commit-ms: ${ECHO_REQUEST_LOG_SPOOL_GROUP_COMMIT_MS:2}
      queue-offer-timeout-ms: ${ECHO_REQUEST_LOG_SPOOL_OFFER_TIMEOUT_MS:10000}
      retry-ms: ${ECHO_REQUEST_LOG_SPOOL_RETRY_MS:250}
      max-pending-bytes: ${ECHO_REQUEST_LOG_SPOOL_MAX_PENDING_BYTES:10737418240}
      # Reserve 512 MiB on the spool disk; the background writer checks once per second. Set 0 to disable.
      min-free-bytes: ${ECHO_REQUEST_LOG_SPOOL_MIN_FREE_BYTES:536870912}
  audit:
    retention-days: 30  # Number of days to retain audit records
  cleanup:
    enabled: true           # Enable scheduled purge
    cron: "0 0 3 * * *"     # Executed every day at 3 am
    rule-retention-days: 180  # Rule retention days (default half a year)
    response-retention-days: 180  # Response retention days
  backup:
    enabled: true             # Enable automatic SQLite backups; DBAs manage backups for external databases.
    cron: "0 0 3 * * *"       # Executed every day at 3 am
    path: ./backups           # Backup directory
    retention-days: 7         # Backup retention days
    max-total-bytes: ${ECHO_BACKUP_MAX_TOTAL_BYTES:10737418240} # Limit completed backups to 10 GiB in total.
    max-files: ${ECHO_BACKUP_MAX_FILES:100} # Bound the number of small backups while retaining at least the latest verified valid backup.
    min-free-bytes: ${ECHO_BACKUP_MIN_FREE_BYTES:536870912} # Reserve 512 MiB before starting copying
    housekeeping-interval-ms: ${ECHO_BACKUP_HOUSEKEEPING_INTERVAL_MS:3600000} # Independent cleaning every hour
    on-shutdown: true         # Backup when application is closed
  agent:
    log:
      queue-capacity: 3000           # LogAgent queue capacity
      batch-size: 50                # Batch size trigger threshold
      flush-interval-seconds: 5     # Time trigger interval (seconds)
      max-write-rate-per-second: ${ECHO_AGENT_LOG_MAX_WRITE_RATE_PER_SECOND:1000}
    analysis:
      enabled: true                 # Enable match chain analysis (near-miss / shadowed detection)
  matcher:
    max-field-value-length: 2097152  # Maximum field-value length in bytes, default 2 MB; skip matching values that exceed it.
  builtin-account:
    self-registration: false  # Set to true to allow non-logged-in users to apply for accounts by themselves
  ldap:
    enabled: false  # Set to true to enable LDAP authentication
    url: ldap://ldap.example.com:389
    base-dn: dc=example,dc=com
    user-pattern: uid={0},ou=users

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Downstream/database failure only affects readiness, preventing external failures from causing infinite restarts.
        liveness:
          include: livenessState
        readiness:
          # Add requestLog to this list when durable logging is required for traffic admission.
          # It is observable in overall health; liveness never restarts the process for retained log data.
          include: readinessState,db,diskSpace,jmsSource
  health:
    # Observe only existing listeners; probes must not create additional TIBCO/Artemis connections.
    jms:
      enabled: false
    diskspace:
      path: ${ECHO_HEALTH_STORAGE_PATH:.}
      threshold: ${ECHO_HEALTH_MIN_FREE_BYTES:536870912}

logging:
  file:
    path: ${LOGGING_FILE_PATH:./logs}  # Default ./logs, can be overridden by environment variables
  level:
    root: WARN
    com.echo: INFO
