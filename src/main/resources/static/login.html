<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo－登入</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260906.2">
    <link rel="stylesheet" href="/theme.css?v=20261006.1">
    <script src="/ui-accent.js?v=20261006.1"></script>
    <link rel="stylesheet" href="/webjars/bootstrap-icons/font/bootstrap-icons.min.css">
    <style>
        /* 登入頁專用衍生變數（基於 theme.css 共用變數） */
        :root{--input-bg:var(--bg);--login-shadow:rgba(0,0,0,0.24);--footer-bg:rgba(var(--muted-rgb),0.08);--logo-outer:var(--primary);--login-focus:0 0 0 2px rgba(var(--primary-rgb),0.42);--motion-fast:120ms;--motion-slow:240ms;--ease-standard:cubic-bezier(0.2,0,0,1)}
        :root[data-theme="light"]{--input-bg:var(--bg);--login-shadow:rgba(29,35,45,0.14);--footer-bg:rgba(var(--muted-rgb),0.07)}
        *{box-sizing:border-box;margin:0;padding:0}
        @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/webjars/fontsource__jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
        @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url('/webjars/fontsource__jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2') format('woff2')}
        body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

        /* 版面：左側品牌區、右側登入表單 */
        .login-shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,1fr)}
        .login-brand{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:28px;padding:48px 56px;background:var(--sidebar-bg);border-right:1px solid var(--border)}
        .login-wave{position:absolute;right:-300px;top:40px;width:640px;height:640px;color:var(--primary);pointer-events:none}
        .login-brand-top{position:relative;display:flex;align-items:center;gap:10px}
        .login-brand-top img{width:26px;height:26px;display:block}
        .login-brand-name{font-size:18px;font-weight:600;letter-spacing:-0.01em}
        .login-env{padding:1px 7px;border:1px solid rgba(var(--primary-rgb),0.38);border-radius:5px;background:rgba(var(--primary-rgb),0.12);color:var(--primary);font:600 10.5px/1.6 'JetBrains Mono',Consolas,Menlo,monospace;letter-spacing:0.06em;text-transform:uppercase}
        .login-brand-copy{position:relative;margin-top:auto;max-width:520px;display:flex;flex-direction:column;gap:16px}
        .login-tagline{max-width:13em;text-wrap:balance;font-size:40px;line-height:1.2;font-weight:600;letter-spacing:-0.02em}
        .login-description{color:var(--muted);font-size:15px;line-height:1.6}
        .login-demo{position:relative;max-width:520px;list-style:none;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--card) 86%,transparent);font:12.5px/1.5 'JetBrains Mono',Consolas,Menlo,monospace}
        .login-demo li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border)}
        .login-demo li:last-child{border-bottom:0}
        .login-demo-method{font-weight:600}
        .login-demo-method.get{color:var(--method-get)}
        .login-demo-method.post{color:var(--method-post)}
        .login-demo-method.jms{color:var(--protocol-jms)}
        .login-demo-target{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .login-demo-result{color:var(--text-subtle);font-family:var(--font-ui);font-size:12.5px}

        /* 登入表單 */
        .login-card{align-self:center;justify-self:center;width:100%;max-width:380px;margin:48px 32px;position:relative;z-index:1}
        .login-header{padding:0 0 0.25rem;text-align:left;position:relative}
        .login-header .login-logo{display:none}
        .login-subtitle{margin-top:6px;color:var(--muted);font-size:13.5px}
        
        .login-logo{width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.875rem;position:relative}
        .login-logo::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(var(--primary-rgb),0.5);border-radius:50%;opacity:0;pointer-events:none}
        .login-logo img{position:relative;z-index:1;width:52px;height:52px;display:block;object-fit:contain;transition:transform var(--motion-fast) var(--ease-standard)}
        .login-logo:hover img{transform:scale(1.05) rotate(-3deg)}
        .login-logo:hover::after{animation:loginLogoEcho var(--motion-slow) var(--ease-standard)}
        @keyframes loginLogoEcho{from{opacity:.52;transform:scale(.76)}to{opacity:0;transform:scale(1.22)}}
        
        .login-header h1{font-size:1.5rem;font-weight:600;letter-spacing:-0.01em;line-height:1.25;margin:0;color:var(--text)}
        
        .login-body{padding:1.5rem 0 0}
        .form-group{margin-bottom:1.125rem}
        .form-label{display:block;font-size:12px;line-height:1.4;font-weight:600;margin-bottom:0.25rem;color:var(--text)}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;transition:color 0.2s}
        .form-control{width:100%;height:42px;min-height:42px;padding:0 0.75rem 0 40px;font-size:14px;background:var(--input-bg);border:1px solid var(--border2);border-radius:9px;color:var(--text);transition:background-color 0.15s,border-color 0.15s,box-shadow 0.15s}
        .form-control:hover{background:var(--hover);border-color:var(--border2)}
        .form-control:focus{outline:0;border-color:var(--primary);background:var(--card);box-shadow:var(--login-focus)}
        .form-control:focus + i,.input-wrapper:focus-within i{color:var(--primary)}
        .form-control::placeholder{color:var(--muted)}
        
        .remember-row{display:flex;align-items:center;justify-content:space-between}
        .remember-check{display:flex;align-items:center;gap:0.5rem}
        .remember-check input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
        .remember-check label{font-size:13px;color:var(--muted);cursor:pointer}
        
        .btn{width:100%;height:42px;min-height:42px;padding:0 12px;font-size:14px;font-weight:600;border:1px solid transparent;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background-color 0.15s,border-color 0.15s,opacity 0.15s,box-shadow 0.15s;position:relative;font-family:inherit}
        .btn i{font-size:16px;line-height:1}
        .btn-primary{background:var(--btn-primary);border-color:var(--btn-primary);color:var(--on-primary);margin-top:0.5rem}
        .btn-primary:hover{background:var(--btn-primary-hover);border-color:var(--btn-primary-hover);opacity:1}
        
        .alert{padding:0.75rem 0.875rem;border-radius:8px;font-size:13px;margin-bottom:1.125rem;display:flex;align-items:center;gap:0.75rem}
        .alert-danger{background:rgba(var(--danger-rgb),0.08);border:1px solid rgba(var(--danger-rgb),0.3);color:var(--danger)}
        
        .login-footer{padding:1.5rem 0 0;text-align:left}
        .login-footer p{color:var(--muted);font-size:12px;margin:0}
        
        /* 忘記密碼連結 */
        .forgot-link,.forgot-back{padding:0;border:0;background:transparent;font-family:inherit;color:var(--primary);font-size:13px;text-decoration:none;cursor:pointer;transition:opacity 0.15s}
        .forgot-link:hover{opacity:0.8}
        .forgot-link:focus-visible,.forgot-back:focus-visible,.btn:focus-visible{outline:0;box-shadow:var(--login-focus)}

        /* 忘記密碼表單 */
        .forgot-section{display:none}
        .forgot-section.active{display:block}
        .forgot-title{font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:var(--text);text-align:center}
        .forgot-success{padding:1rem;border-radius:6px;font-size:13px;background:rgba(var(--success-rgb),0.08);border:1px solid rgba(var(--success-rgb),0.25);color:var(--success);text-align:center;margin-bottom:1rem}
        .forgot-back{display:inline-block;margin-top:0.5rem}
        .forgot-back:hover{opacity:0.8}
        .btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);margin-top:0.5rem}
        .btn-secondary:hover{border-color:var(--border2);background:var(--hover)}

        /* LDAP 提示 */
        .ldap-hint{display:none;color:var(--muted);font-size:12px;text-align:center;margin-top:0.75rem}

        /* 註冊表單 */
        .register-section{display:none}
        .register-section.active{display:block}
        .register-error{padding:0.875rem 1rem;border-radius:6px;font-size:13px;background:rgba(var(--danger-rgb),0.08);border:1px solid rgba(var(--danger-rgb),0.25);color:var(--danger);margin-bottom:1rem;text-align:center}
        .register-link{display:none;margin-top:0.5rem}

        /* 響應式 */
        @media(max-width:900px){.login-shell{grid-template-columns:1fr}.login-brand{display:none}.login-card{margin:0 auto;padding:48px 20px}.login-header{text-align:center}.login-header .login-logo{display:flex}.login-footer{text-align:center}}
        @media(prefers-reduced-motion:reduce){.login-logo img{transition-duration:.01ms}.login-logo:hover::after{animation:none}}
    </style>
</head>
<body>
<div class="login-shell">
    <section class="login-brand" aria-labelledby="login-tagline">
        <svg class="login-wave" viewBox="0 0 520 520" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
            <circle cx="60" cy="260" r="9" fill="currentColor" stroke="none"/>
            <path d="M111.4 198.7A80 80 0 0 1 111.4 321.3" stroke-width="2.5" opacity="0.9"/>
            <path d="M150 152.8A140 140 0 0 1 150 367.2" stroke-width="2.25" opacity="0.6"/>
            <path d="M188.6 106.8A200 200 0 0 1 188.6 413.2" stroke-width="2" opacity="0.38"/>
            <path d="M227.1 60.8A260 260 0 0 1 227.1 459.2" stroke-width="1.75" opacity="0.22"/>
            <path d="M265.7 14.9A320 320 0 0 1 265.7 505.1" stroke-width="1.5" opacity="0.12"/>
        </svg>
        <div class="login-brand-top">
            <img src="/favicon.ico?v=20260906.2" alt="">
            <span class="login-brand-name">Echo</span>
            <span id="login-env" class="login-env" hidden></span>
        </div>
        <div class="login-brand-copy">
            <p id="login-tagline" class="login-tagline" data-i18n="login.brandTagline">每個請求，都有預期的回聲。</p>
            <p class="login-description" data-i18n="login.brandDescription">HTTP 與 JMS 雙協定模擬伺服器。以規則匹配請求，回傳模擬內容、轉發下游，或注入故障。</p>
        </div>
        <ul class="login-demo" aria-label="規則匹配示意" data-i18n-aria-label="login.demoLabel">
            <li><span class="login-demo-method get">GET</span><span class="login-demo-target">/api/orders?status=pending</span><span class="login-demo-result" data-i18n="login.demoMock">→ 回傳模擬回應</span></li>
            <li><span class="login-demo-method jms">JMS</span><span class="login-demo-target">type=PAYMENT</span><span class="login-demo-result" data-i18n="login.demoReply">→ 回覆 JMS 訊息</span></li>
            <li><span class="login-demo-method post">POST</span><span class="login-demo-target">/api/payments</span><span class="login-demo-result" data-i18n="login.demoForward">→ 轉發下游</span></li>
        </ul>
    </section>

    <main class="login-card">
        <div class="login-header">
            <div class="login-logo"><img src="/favicon.ico?v=20260906.2" alt=""></div>
            <h1 data-i18n="login.heading">登入</h1>
            <p class="login-subtitle" data-i18n="login.subtitle">請登入以管理模擬規則</p>
        </div>
        
        <div class="login-body">
            <div id="error-alert" class="alert alert-danger" style="display:none">
                <i class="bi bi-exclamation-circle"></i>
                <span data-i18n="login.errorMsg">帳號或密碼錯誤</span>
            </div>
            
            <form action="/api/auth/login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="login-username" data-i18n="login.username">帳號</label>
                    <div class="input-wrapper">
                        <input id="login-username" type="text" class="form-control" name="username" autocomplete="username" data-i18n-placeholder="login.usernamePlaceholder" placeholder="請輸入帳號" required autofocus>
                        <i class="bi bi-person"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password" data-i18n="login.password">密碼</label>
                    <div class="input-wrapper">
                        <input id="login-password" type="password" class="form-control" name="password" autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="請輸入密碼" required>
                        <i class="bi bi-lock"></i>
                    </div>
                </div>
                <div class="form-group remember-row">
                    <div class="remember-check">
                        <input type="checkbox" name="remember-me" id="remember-me" checked>
                        <label for="remember-me" data-i18n="login.rememberMe">記住我</label>
                    </div>
                    <button type="button" id="forgot-link" class="forgot-link" data-i18n="login.forgotPassword">忘記密碼？</button>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> <span data-i18n="login.submit">登入</span>
                </button>
                <div class="ldap-hint" id="ldap-hint" data-i18n="login.ldapHint">公司員工請使用 AD 帳號登入，外部廠商請使用管理員提供的帳號。</div>
                <div class="register-link" id="register-link"><button type="button" class="btn btn-secondary"><i class="bi bi-person-plus"></i> <span data-i18n="login.register">申請帳號</span></button></div>
            </form>

            <!-- 忘記密碼表單 -->
            <div id="forgot-section" class="forgot-section">
                <div class="forgot-title" data-i18n="login.forgotPasswordTitle">忘記密碼</div>
                <div id="forgot-success" class="forgot-success" style="display:none">
                    <span data-i18n="login.forgotPasswordSuccess">已送出請求，請聯繫管理員協助重設密碼。</span>
                    <br>
                    <button type="button" id="forgot-back-success" class="forgot-back" data-i18n="login.forgotPasswordBack">返回登入</button>
                </div>
                <div id="forgot-form-fields">
                    <div class="form-group">
                        <label class="form-label" for="forgot-username" data-i18n="login.username">帳號</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-control" id="forgot-username" autocomplete="off" data-i18n-placeholder="login.forgotPasswordUsername" placeholder="請輸入您的帳號" required>
                            <i class="bi bi-person"></i>
                        </div>
                    </div>
                    <button type="button" id="forgot-submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> <span data-i18n="login.forgotPasswordSubmit">送出請求</span>
                    </button>
                    <button type="button" id="forgot-back" class="btn btn-secondary">
                        <span data-i18n="login.forgotPasswordBack">返回登入</span>
                    </button>
                </div>
            </div>

            <!-- 自助註冊表單 -->
            <div id="register-section" class="register-section">
                <div class="forgot-title" data-i18n="login.registerTitle">申請帳號</div>
                <div id="register-success" class="forgot-success" style="display:none">
                    <span data-i18n="login.registerSuccess">帳號已建立，您現在可以登入了。</span>
                    <br>
                    <button type="button" id="register-back-success" class="forgot-back" data-i18n="login.registerBack">返回登入</button>
                </div>
                <div id="register-error" class="register-error" style="display:none"></div>
                <div id="register-form-fields">
                    <div class="form-group">
                        <label class="form-label" for="register-username" data-i18n="login.username">帳號</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-control" id="register-username" autocomplete="off" data-i18n-placeholder="login.registerUsername" placeholder="請輸入帳號" required>
                            <i class="bi bi-person"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="register-password" data-i18n="login.password">密碼</label>
                        <div class="input-wrapper">
                            <input type="password" class="form-control" id="register-password" autocomplete="off" data-i18n-placeholder="login.registerPassword" placeholder="請輸入密碼" required>
                            <i class="bi bi-lock"></i>
                        </div>
                    </div>
                    <button type="button" id="register-submit" class="btn btn-primary">
                        <i class="bi bi-person-plus"></i> <span data-i18n="login.registerSubmit">建立帳號</span>
                    </button>
                    <button type="button" id="register-back" class="btn btn-secondary">
                        <span data-i18n="login.registerBack">返回登入</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="login-footer">
            <p>Echo Mock Server</p>
        </div>
    </main>
</div>
    
    <script>
        (function() {
            // Theme
            var t = localStorage.getItem('theme') || 'dark';
            var effective = t === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
            document.documentElement.setAttribute('data-theme', effective);
            document.documentElement.style.colorScheme = effective;

            // Error alert
            if (window.location.search.includes('error')) {
                document.getElementById('error-alert').style.display = 'flex';
            }

            // i18n - lightweight locale swap for login page
            var stored = localStorage.getItem('echo_locale');
            var locale = stored || (navigator.language.startsWith('zh') ? 'zh-TW' : 'en');
            document.documentElement.lang = locale === 'zh-TW' ? 'zh-TW' : 'en';
            if (locale !== 'zh-TW') {
                fetch('/i18n/' + locale + '.json?v=20261006.2').then(function(r) { return r.json(); }).then(function(msgs) {
                    var login = msgs.login;
                    if (!login) return;
                    document.title = login.title || document.title;
                    document.querySelectorAll('[data-i18n]').forEach(function(el) {
                        var key = el.getAttribute('data-i18n').split('.')[1];
                        if (login[key]) el.textContent = login[key];
                    });
                    document.querySelectorAll('[data-i18n-aria-label]').forEach(function(el) {
                        var key = el.getAttribute('data-i18n-aria-label').split('.')[1];
                        if (login[key]) el.setAttribute('aria-label', login[key]);
                    });
                    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                        var key = el.getAttribute('data-i18n-placeholder').split('.')[1];
                        if (login[key]) el.placeholder = login[key];
                    });
                }).catch(function() {});
            }

            // --- Forgot Password Flow ---
            var loginForm = document.querySelector('form');
            var forgotSection = document.getElementById('forgot-section');
            var forgotLink = document.getElementById('forgot-link');
            var forgotBack = document.getElementById('forgot-back');
            var forgotBackSuccess = document.getElementById('forgot-back-success');
            var forgotSubmit = document.getElementById('forgot-submit');
            var forgotUsername = document.getElementById('forgot-username');
            var forgotSuccess = document.getElementById('forgot-success');
            var forgotFormFields = document.getElementById('forgot-form-fields');
            var errorAlert = document.getElementById('error-alert');

            function showForgot() {
                loginForm.style.display = 'none';
                forgotSection.classList.add('active');
                errorAlert.style.display = 'none';
                forgotSuccess.style.display = 'none';
                forgotFormFields.style.display = 'block';
                forgotUsername.value = '';
                forgotUsername.focus();
            }

            function showLogin() {
                forgotSection.classList.remove('active');
                loginForm.style.display = 'block';
            }

            forgotLink.addEventListener('click', showForgot);
            forgotBack.addEventListener('click', showLogin);
            forgotBackSuccess.addEventListener('click', showLogin);

            forgotSubmit.addEventListener('click', function() {
                var username = forgotUsername.value.trim();
                if (!username) {
                    forgotUsername.focus();
                    return;
                }
                forgotSubmit.disabled = true;
                fetch('/api/admin/builtin-users/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username: username })
                }).then(function() {
                    forgotFormFields.style.display = 'none';
                    forgotSuccess.style.display = 'block';
                }).catch(function() {
                    forgotFormFields.style.display = 'none';
                    forgotSuccess.style.display = 'block';
                }).finally(function() {
                    forgotSubmit.disabled = false;
                });
            });

            // --- LDAP Hint ---
            fetch('/api/admin/status', { headers: { 'Accept': 'application/json' } }).then(function(r) { return r.json(); }).then(function(data) {
                if (window.EchoAccent) {
                    window.EchoAccent.apply(data.uiAccent);
                }
                if (data.envLabel) {
                    var envLabel = document.getElementById('login-env');
                    envLabel.textContent = data.envLabel;
                    envLabel.hidden = false;
                }
                if (data.ldapEnabled) {
                    document.getElementById('ldap-hint').style.display = 'block';
                }
                if (data.selfRegistrationEnabled) {
                    document.getElementById('register-link').style.display = 'block';
                }
            }).catch(function() {});

            // --- Self Registration Flow ---
            var registerSection = document.getElementById('register-section');
            var registerLink = document.getElementById('register-link');
            var registerBack = document.getElementById('register-back');
            var registerBackSuccess = document.getElementById('register-back-success');
            var registerSubmitBtn = document.getElementById('register-submit');
            var registerUsernameInput = document.getElementById('register-username');
            var registerPasswordInput = document.getElementById('register-password');
            var registerSuccess = document.getElementById('register-success');
            var registerError = document.getElementById('register-error');
            var registerFormFields = document.getElementById('register-form-fields');

            function showRegister() {
                loginForm.style.display = 'none';
                forgotSection.classList.remove('active');
                registerSection.classList.add('active');
                errorAlert.style.display = 'none';
                registerSuccess.style.display = 'none';
                registerError.style.display = 'none';
                registerFormFields.style.display = 'block';
                registerUsernameInput.value = '';
                registerPasswordInput.value = '';
                registerUsernameInput.focus();
            }

            function showLoginFromRegister() {
                registerSection.classList.remove('active');
                loginForm.style.display = 'block';
            }

            registerLink.addEventListener('click', showRegister);
            registerBack.addEventListener('click', showLoginFromRegister);
            registerBackSuccess.addEventListener('click', showLoginFromRegister);

            // 錯誤碼對應翻譯（使用已載入的 locale 訊息）
            var registerErrorMessages = {
                'zh-TW': {
                    'USERNAME_EXISTS': '帳號已存在',
                    'USERNAME_LENGTH': '帳號長度須為 3-50 字元',
                    'PASSWORD_TOO_SHORT': '密碼長度至少 6 字元',
                    'SELF_REGISTRATION_DISABLED': '自助註冊功能未啟用'
                },
                'en': {
                    'USERNAME_EXISTS': 'Username already exists',
                    'USERNAME_LENGTH': 'Username must be 3-50 characters',
                    'PASSWORD_TOO_SHORT': 'Password must be at least 6 characters',
                    'SELF_REGISTRATION_DISABLED': 'Self-registration is disabled'
                }
            };
            var regErrors = registerErrorMessages[locale] || registerErrorMessages['en'];

            registerSubmitBtn.addEventListener('click', function() {
                var username = registerUsernameInput.value.trim();
                var password = registerPasswordInput.value;
                if (!username) { registerUsernameInput.focus(); return; }
                if (!password) { registerPasswordInput.focus(); return; }
                registerSubmitBtn.disabled = true;
                registerError.style.display = 'none';
                fetch('/api/admin/builtin-users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                }).then(function(r) {
                    if (r.ok) {
                        registerFormFields.style.display = 'none';
                        registerSuccess.style.display = 'block';
                    } else {
                        return r.json().then(function(body) {
                            var code = body.error;
                            registerError.textContent = regErrors[code] || code || 'Registration failed';
                            registerError.style.display = 'block';
                        });
                    }
                }).catch(function() {
                    registerError.textContent = regErrors['NETWORK_ERROR'] || 'Network error';
                    registerError.style.display = 'block';
                }).finally(function() {
                    registerSubmitBtn.disabled = false;
                });
            });
        })();
    </script>
</body>
</html>
