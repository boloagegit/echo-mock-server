# Always use SQLite for testing. Each Spring context has a temporary database file (WAL + busy_timeout, the same as the official environment),
# Located at build/test-db, gradle and clean will be cleared together. The SQLite shared cache memory database is not used: it uses table locks,
# Not controlled by busy_timeout, parallel integration tests will intermittently appear "table is locked".
# Individual tests can still be overridden with @TestPropertySource.
spring.test.database.replace=none
spring.datasource.url=jdbc:sqlite:./build/test-db/echo-${random.uuid}.sqlite?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&foreign_keys=ON
spring.jpa.hibernate.ddl-auto=create-drop
