# Database: Use the default SQLite. For the test database location, see src/test/resources/config/application.properties.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

echo:
  cache:
    sync-enabled: false
  admin:
    username: admin
    password: "{noop}admin"
  jms:
    enabled: true
    port: 0
    persistent: false
  ldap:
    enabled: false
  backup:
    enabled: false
  cleanup:
    enabled: false
  env-label: TEST
  request-log:
    store: memory
    max-records: 1000
  agent:
    log:
      flush-interval-seconds: 1
      batch-size: 1

logging:
  level:
    com.echo: DEBUG
