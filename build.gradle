plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.13'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'com.echo'
def releaseVersion = providers.gradleProperty('releaseVersion').orNull?.trim()
def gitTag = providers.exec {
    commandLine 'git', 'describe', '--tags', '--abbrev=0'
    ignoreExitValue = true
}.standardOutput.asText.get().trim()
version = releaseVersion ?: (gitTag ? gitTag.replaceFirst(/^v/, '') : '0.0.0-SNAPSHOT')
description = 'Enterprise-grade dual-protocol mock server for HTTP and JMS'

// Capture the source identity at build time; deployed JARs never invoke Git.
def gitCommit = providers.exec {
    commandLine 'git', 'rev-parse', '--verify', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.get().trim()
def gitStatus = providers.exec {
    commandLine 'git', 'status', '--porcelain', '--untracked-files=normal'
    ignoreExitValue = true
}
def gitDirty = gitCommit && gitStatus.result.get().exitValue == 0
        ? !gitStatus.standardOutput.asText.get().trim().isEmpty() : null

springBoot {
    buildInfo {
        properties {
            additional = [
                    'git.commit': gitCommit,
                    'git.dirty': gitDirty == null ? 'unknown' : gitDirty.toString()
            ]
        }
    }
}

// Required by the current SpotBugs/BCEL toolchain and backward-compatible with
// Spring Boot 3.5's managed Commons Lang API.
ext['commons-lang3.version'] = '3.20.0'
// Keep the Netty 4.1 modules aligned; 4.1.139 fixes compressed response truncation
// and the subsequent decompression-buffer-limit regression.
ext['netty.version'] = '4.1.139.Final'

// Artemis moved its Maven group in 2.50. Keep the client and embedded broker
// together; 2.54+ fixes byte-at-a-time copies when reading large messages.
dependencyManagement {
    imports {
        mavenBom 'org.apache.artemis:artemis-bom:2.57.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Apply the source-pinned client cleanup consistently to compilation and packaging.
apply from: 'gradle/artemis-heartbeat-patch.gradle'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Spring's spring-jcl provides the Commons Logging API bridge. Keeping the
// original commons-logging jar alongside it causes duplicate discovery and
// can select the wrong implementation at runtime.
configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web with Undertow (exclude Tomcat)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    // Reactive outbound HTTP only; the application server remains Spring MVC + Undertow.
    implementation 'io.projectreactor.netty:reactor-netty-http'
    // Keep Reactor's asynchronous DNS resolver accurate on both Apple Silicon and Intel Macs.
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-x86_64'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    modules {
        module('org.springframework.boot:spring-boot-starter-tomcat') {
            replacedBy('org.springframework.boot:spring-boot-starter-undertow', 'Use Undertow instead of Tomcat')
        }
    }

    // Data & Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'

    // Monitoring & Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Caching with Caffeine
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // JSON Path for WireMock-style matching
    implementation 'com.jayway.jsonpath:json-path:3.0.0'

    // Handlebars for Response Templating
    implementation 'com.github.jknack:handlebars:4.5.4'

    // Excel parsing with Apache POI
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // OpenAPI/Swagger spec parsing
    implementation 'io.swagger.parser.v3:swagger-parser:2.1.46'

    // Security & LDAP
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-ldap'
    implementation 'org.springframework.security:spring-security-ldap'

    // Messaging with Artemis
    implementation('org.springframework.boot:spring-boot-starter-artemis') {
        exclude group: 'org.apache.activemq', module: 'artemis-jakarta-client'
    }
    implementation 'org.apache.artemis:artemis-jakarta-client'
    implementation 'org.apache.artemis:artemis-jakarta-server'

    // TIBCO EMS (optional - place tibjms.jar in libs/)
    compileOnly files('libs/tibjms.jar')

    // WebJars for Intranet-friendly Frontend (NO CDN)
    // Spring MVC resolves versionless URLs using WebJar metadata, without a full ClassGraph scan.
    implementation 'org.webjars:webjars-locator-lite'
    implementation 'org.webjars.npm:vue:3.5.43'
    implementation 'org.webjars.npm:bootstrap:5.3.8'
    implementation 'org.webjars.npm:bootstrap-icons:1.13.1'
    // The UI uses CodeMirror 5's global API and /lib paths; 5.65.21 is the latest compatible release.
    implementation 'org.webjars.npm:codemirror:5.65.21'
    // Bundled monospace font so endpoints and code render the same on Windows and macOS.
    implementation 'org.webjars.npm:fontsource__jetbrains-mono:4.5.11'

    // Feign (compileOnly - for MockRedirectClient reference code)
    compileOnly 'io.github.openfeign:feign-core:13.17'
    testImplementation 'io.github.openfeign:feign-core:13.17'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Error Prone (compile-time only, does NOT affect runtime)
    // 2.42.0 is the newest Error Prone release that can run on the Java 17 toolchain.
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    // Testing
    testImplementation 'io.micrometer:micrometer-tracing-bridge-brave'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.hdrhistogram:HdrHistogram:2.2.2'
    testImplementation 'com.unboundid:unboundid-ldapsdk:7.0.5'
    testImplementation 'net.jqwik:jqwik:1.10.1'
    // Architecture boundary rules (see docs/design/engine-extensibility.md)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // Run test classes in separate JVMs in parallel, each with its own Spring context and random database filenames and ports to avoid interference.
    // Use half the cores: Spring context startup is CPU-intensive, and using every core causes contention. -PtestForks=1 selects a single JVM.
    maxParallelForks = providers.gradleProperty('testForks').map { it as int }
            .getOrElse(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))
}

// Opt-in SQLite main-DB writer comparison; never part of unit-test gates.
tasks.register('requestLogWriteCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.service.RequestLogWriteCostProbe'
    args providers.gradleProperty('requestLogCostOutput').getOrElse('artifacts/request-log-cost'),
            providers.gradleProperty('requestLogCostMode').getOrElse('jpa'),
            providers.gradleProperty('requestLogCostWarmupSeconds').getOrElse('8'),
            providers.gradleProperty('requestLogCostMeasureSeconds').getOrElse('15')
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+UseG1GC'
}

// Opt-in real SQLite spool read comparison; never part of unit-test gates.
tasks.register('requestLogSpoolReadCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.agent.RequestLogSpoolReadCostProbe'
    args providers.gradleProperty('spoolReadCostOutput').getOrElse('artifacts/spool-read-cost'),
            providers.gradleProperty('spoolReadCostWarmupSeconds').getOrElse('5'),
            providers.gradleProperty('spoolReadCostMeasureSeconds').getOrElse('8')
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+UseG1GC'
}

// Opt-in, short real-JMS/file-output A/B measurement; never part of unit-test gates.
tasks.register('jmsApplicationCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.jms.JmsApplicationCostProbe'
    args providers.gradleProperty('jmsBenchmarkOutput').getOrElse('artifacts/jms-application-cost')
    jvmArgs '-Xms1g', '-Xmx1g', '-XX:+UseG1GC'
}

// Opt-in, short real-JMS/file-output A/B measurement; never part of unit-test gates.
tasks.register('jmsForwardingCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.jms.JmsForwardingCostProbe'
    args providers.gradleProperty('jmsBenchmarkOutput').getOrElse('artifacts/jms-forwarding-cost')
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+UseG1GC'
}

// Opt-in persistent TCP broker failure/recovery soak; reports stay in ignored artifacts/.
tasks.register('jmsRecoverySoak', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.jms.JmsRecoveryProbe'
    systemProperty 'logback.configurationFile', file('src/test/resources/jms-recovery-logback.xml').absolutePath
    args providers.gradleProperty('jmsRecoverySeconds').getOrElse('600'),
            providers.gradleProperty('jmsRecoveryOutput').getOrElse('artifacts/jms-recovery')
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+UseG1GC'
}

// Opt-in, short real-JMS/file-output A/B measurement; never part of unit-test gates.
tasks.register('diagnosticCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.diagnostics.DiagnosticCostProbe'
    args providers.gradleProperty('diagnosticOutput').getOrElse('artifacts/diagnostics-cost'),
            providers.gradleProperty('diagnosticRequests').getOrElse('1500')
    jvmArgs '-Xmx512m'
}

// Opt-in short real AP / HTTP / SQLite / durable-spool comparison, isolated temp data.
tasks.register('diagnosticApplicationCost', JavaExec) {
    dependsOn testClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.diagnostics.ApplicationDiagnosticCostProbe'
    args providers.gradleProperty('diagnosticOutput').getOrElse('artifacts/diagnostics-cost'),
            providers.gradleProperty('diagnosticRequests').getOrElse('1000')
    jvmArgs '-Xmx512m'
}

// Opt-in Docker fixture only: never included in the application or normal test gates.
tasks.register('dockerDiagnosticFixtureJar', Jar) {
    dependsOn testClasses
    archiveFileName = 'echo-diagnostic-fixture.jar'
    from(sourceSets.test.output) {
        include 'com/echo/diagnostics/ContainerDiagnosticFixture*.class'
    }
}

// Standalone Windows/Linux load fixture; no Docker or application packaging dependency.
tasks.register('memoryObservationFixtureJar', Jar) {
    dependsOn testClasses
    archiveFileName = 'echo-memory-observation-fixture.jar'
    from(sourceSets.test.output) {
        include 'com/echo/diagnostics/MemoryObservationFixture*.class'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacoco {
    toolVersion = "0.8.15"
}

// SpotBugs static analysis
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import net.ltgt.gradle.errorprone.CheckSeverity

// Error Prone compile-time checks; these do not affect runtime behavior.
tasks.withType(JavaCompile).configureEach {
    // Source files contain Chinese text; Windows JDK 17 may default to a legacy code page.
    options.encoding = 'UTF-8'
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // Disable false positives triggered by Lombok-generated code.
        check('DefaultCharset', CheckSeverity.OFF)
        // Disable checks that conflict with Spring conventions.
        check('ImmutableEnumChecker', CheckSeverity.OFF)
        check('MutablePublicArray', CheckSeverity.OFF)
        // Internal Mock Server usage: String.split has well-defined behavior for known delimiters.
        check('StringSplitter', CheckSeverity.OFF)
        // This application uses a single-server deployment; LocalDateTime.now() intentionally uses the system time zone.
        check('JavaTimeDefaultTimeZone', CheckSeverity.OFF)
        // Handlebars helper requires java.util.Date
        check('JavaUtilDate', CheckSeverity.OFF)
    }
}

// Relax Error Prone checks for test code.
tasks.named('compileTestJava').configure {
    options.errorprone {
        check('MissingSummary', CheckSeverity.OFF)
        check('JUnitAmbiguousTestClass', CheckSeverity.OFF)
    }
}

spotbugs {
    ignoreFailures = false
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs-exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}
// Test code does not require SpotBugs static analysis
spotbugsTest.enabled = false

// Build Fat Jar
// SDK producers publish download resources, never server runtime dependencies.
apply from: 'gradle/sdk-catalog.gradle'
dependencies {
    echoSdkReleases project(path: ':sdk', configuration: 'echoSdkRelease')
}

tasks.named('bootJar') {
    archiveBaseName = 'echo-server'
    archiveVersion = version
    manifest {
        attributes(
            'Implementation-Title': 'Echo Mock Server',
            'Implementation-Version': version
        )
    }
}

// Read static resources directly from src during development; refresh the browser to see changes.
bootRun {
    sourceResources sourceSets.main
}

// Quick start command
tasks.register('dev') {
    group = 'application'
    description = 'Run in dev mode (no login required)'
    doFirst {
        // The dev task uses the dev profile and the default SQLite database from application.yml.
        bootRun.configure {
            args = ["--spring.profiles.active=dev"]
        }
    }
    finalizedBy 'bootRun'
}

// Quick test command
tasks.register('t') {
    group = 'verification'
    description = 'Run all tests (shortcut)'
    dependsOn 'test'
}

tasks.register('runJmsTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.echo.jms.ManualJmsTest'
}
