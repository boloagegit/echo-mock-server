services:
  echo:
    build: .
    image: echo-mock-server:latest
    container_name: echo
    ports:
      - "8080:8080"   # HTTP
      - "61616:61616" # JMS Artemis
    environment:
      - ECHO_ADMIN_USERNAME=${ECHO_ADMIN_USERNAME:-admin}       # ⚠️ Please replace it in production environment
      - ECHO_ADMIN_PASSWORD=${ECHO_ADMIN_PASSWORD:-admin}       # ⚠️ Please replace the production environment to support bcrypt hash
      - ECHO_REMEMBER_ME_KEY=${ECHO_REMEMBER_ME_KEY:-change-me} # ⚠️ Please replace it in production environment
      - ECHO_ENV_LABEL=DOCKER
      - TZ=Asia/Taipei
    volumes:
      - echo-data:/app/data
      - echo-backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: application/json", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  echo-data:
  echo-backups:
