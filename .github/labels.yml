# Echo Mock Server - GitHub Labels
# Canonical label catalog, synced by .github/workflows/manage-labels.yml

# === Type ===
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "refactor"
  color: "d4c5f9"
  description: "Code improvement without changing behavior"

- name: "chore"
  color: "ededed"
  description: "Maintenance tasks, CI, dependencies"

- name: "performance"
  color: "f9d0c4"
  description: "Runtime or build performance improvements"

- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"

- name: "breaking-change"
  color: "b60205"
  description: "Requires users to change configuration or integration code"

# === Priority ===
- name: "priority:high"
  color: "e11d48"
  description: "Needs immediate attention"

- name: "priority:medium"
  color: "fbca04"
  description: "Should be addressed soon"

- name: "priority:low"
  color: "0e8a16"
  description: "Nice to have, no rush"

# === Status ===
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "status:needs-info"
  color: "d4c5f9"
  description: "More information is required before work can continue"

- name: "status:stale"
  color: "cfd3d7"
  description: "No recent activity"

- name: "ignore-for-release"
  color: "ffffff"
  description: "Exclude this change from generated release notes"

# === Area ===
- name: "area:http"
  color: "1d76db"
  description: "HTTP mock protocol"

- name: "area:jms"
  color: "5319e7"
  description: "JMS mock protocol"

- name: "area:ui"
  color: "f9d0c4"
  description: "Frontend / Vue.js UI"

- name: "area:api"
  color: "bfd4f2"
  description: "Backend REST API"

- name: "area:backend"
  color: "0052cc"
  description: "Backend services, persistence, or configuration"

- name: "area:security"
  color: "ee0701"
  description: "Authentication, authorization, or security"

- name: "area:docker"
  color: "0db7ed"
  description: "Container image or Docker Compose"

- name: "area:build"
  color: "5319e7"
  description: "Build system or GitHub automation"
