version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    ignore:
      # Error Prone 2.50+ needs a Java 21 compiler; the build runs on Java 17.
      # Upgrade it together with the build JDK, not automatically.
      - dependency-name: "com.google.errorprone:error_prone_core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    ignore:
      # Echo targets Java 17. Switching Java versions is a deliberate change,
      # not an automatic bump (Dependabot also proposes non-LTS releases such as 23).
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
