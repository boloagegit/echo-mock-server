version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    ignore:
      # Echo targets Java 17. Switching Java versions is a deliberate change,
      # not an automatic bump (Dependabot also proposes non-LTS releases such as 23).
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
