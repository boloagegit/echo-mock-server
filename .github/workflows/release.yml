name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Test
        run: ./gradlew build

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          JAR_NAME="echo-server-${{ steps.version.outputs.version }}.jar"
          cp build/libs/echo-server-*.jar "dist/${JAR_NAME}"
          cd dist
          sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"

      - name: Smoke test JAR
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/echo-release-smoke.log"
          java -jar dist/echo-server-*.jar \
            --spring.profiles.active=dev \
            --server.port=18080 >"$LOG" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          READY=false
          for _ in $(seq 1 45); do
            if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
              cat "$LOG"
              echo "Application stopped before becoming healthy" >&2
              exit 1
            fi
            if curl --fail --silent \
              --header 'Accept: application/json' \
              http://localhost:18080/api/admin/status >/dev/null; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != true ]; then
            cat "$LOG"
            echo "Application did not become healthy within 45 seconds" >&2
            exit 1
          fi

          kill "$APP_PID"
          wait "$APP_PID" || true
          trap - EXIT

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/echo-server-*.jar
            dist/echo-server-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
