name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress jobs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk-version: [17, 21]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.jdk-version }}
        uses: actions/setup-java@v6
        with:
          java-version: '${{ matrix.jdk-version }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Test
        run: ./gradlew build jacocoTestReport

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-jdk${{ matrix.jdk-version }}
          path: build/reports/tests/test/
          retention-days: 14

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-jdk${{ matrix.jdk-version }}
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report-jdk${{ matrix.jdk-version }}
          path: build/reports/spotbugs/
          retention-days: 14

      - name: Upload JAR
        if: success() && matrix.jdk-version == 17
        uses: actions/upload-artifact@v7
        with:
          name: echo-server-jar
          path: build/libs/echo-server-*.jar
          retention-days: 14

  windows-development:
    name: Windows development (17)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: echo windows dev
    steps:
      - name: Enable long checkout paths
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: echo windows dev

      - name: Set up build JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Web console tests
        run: |
          $testFiles = @(Get-ChildItem src/test/js/*.test.cjs -File | ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw 'No web console tests found' }
          node --test @testFiles

      - name: Windows script compatibility tests
        run: python -m unittest discover -s scripts/tests -p test_windows_script_compatibility.py

      - name: Memory observation analyzer tests
        run: python -m unittest discover -s scripts/tests -p test_memory_observability.py

      - name: Build, test and analyze from a path containing spaces
        run: .\gradlew.bat build jacocoTestReport -PtestForks=2 --no-daemon

      - name: Upload Windows test and analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-development-reports
          path: |
            echo windows dev/build/reports/tests/
            echo windows dev/build/reports/spotbugs/
          retention-days: 14

  docker-build-test:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Build Docker image (test only)
        run: docker build -t echo-mock-server:test .
