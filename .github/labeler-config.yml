version: 1
labels:
  # --- Conventional Commit title matching ---
  - label: "bug"
    title: '^fix(\([^)]*\))?:|^fix:.*'

  - label: "enhancement"
    title: '^feat(\([^)]*\))?:|^feat:.*'

  - label: "area:build"
    title: '^build(\([^)]*\))?:|^build:.*'

  - label: "chore"
    title: '^chore(\([^)]*\))?:|^chore:.*'

  - label: "area:build"
    title: '^ci(\([^)]*\))?:|^ci:.*'

  - label: "performance"
    title: '^perf(\([^)]*\))?:|^perf:.*'

  - label: "refactor"
    title: '^refactor(\([^)]*\))?:|^refactor:.*'

  - label: "chore"
    title: '^revert(\([^)]*\))?:|^revert:.*'

  - label: "refactor"
    title: '^style(\([^)]*\))?:|^style:.*'

  - label: "documentation"
    title: '^docs(\([^)]*\))?:|^docs:.*'

  - label: "dependencies"
    title: '^deps(\([^)]*\))?:|^deps:.*'

  # --- File path matching ---
  - label: "area:backend"
    files:
      - 'src/main/java/.*.java'

  - label: "area:backend"
    files:
      - 'src/main/java/com/echo/controller/.*'
      - 'src/main/java/com/echo/service/.*'
      - 'src/main/java/com/echo/config/.*'
      - 'src/main/resources/.*'

  - label: "area:jms"
    files:
      - 'src/main/java/com/echo/jms/.*'

  - label: "area:security"
    files:
      - 'src/main/java/com/echo/config/Security.*'

  - label: "area:docker"
    files:
      - 'Dockerfile'
      - 'docker-compose.yml'

  - label: "documentation"
    files:
      - '.*.md'

  - label: "area:build"
    files:
      - '.github/.*'

  - label: "area:build"
    files:
      - 'gradle/.*'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'

  - label: "area:ui"
    files:
      - 'src/main/resources/static/.*'
